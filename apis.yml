aid: n-drip
name: N-Drip
description: 'N-Drip is an Israeli agritech manufacturer of gravity-powered micro-irrigation
  systems, led by Prof. Uri Shani, Israel''s former Water Commissioner. Its patented
  drip system operates on gravity alone at under 0.87 PSI / 0.06 BAR, requiring no
  pumping station and no pressure-based filtration, and is positioned as a direct
  replacement for flood irrigation — which still accounts for roughly 85 percent of
  the world''s irrigated agriculture and wastes an estimated 70 percent of the water
  it uses. Alongside the hardware the company ships N-Drip Connect, a sensor-and-app
  decision-support platform that measures root-zone water potential and available
  nitrogen, layers NDVI satellite imagery over the field, and issues irrigation and
  fertilization recommendations to growers. N-Drip technology is deployed in ten countries
  and five US states across 25 crop types including rice, corn, soybeans, potatoes,
  sugar cane, alfalfa and cotton, with a US production hub in Yuma, Arizona. N-Drip
  publishes no public developer program, API documentation, SDK or machine-readable
  API contract: N-Drip Connect is delivered strictly as a closed web and mobile application.'
